# SIGINEX · Stack de pruebas (Next.js standalone + PostgreSQL 16).
# Pensado para levantarse en la VM Oracle Cloud Free Tier (Ampere ARM).
#
# Uso:
#   1. Copia .env.example a .env y ajusta credenciales.
#   2. docker compose up -d --build
#   3. Aplica migraciones:  docker compose run --rm migrate
#
# El servicio `web` es la app fullstack (frontend + rutas de API).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siginex}
      POSTGRES_USER: ${POSTGRES_USER:-siginex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - siginex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siginex} -d ${POSTGRES_DB:-siginex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio efímero para aplicar migraciones de Drizzle.
  # Ejecuta:  docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-siginex}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-siginex}
    command: >
      node node_modules/drizzle-kit/bin.cjs migrate
    restart: "no"

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-siginex}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-siginex}
      SIGINEX_API_KEYS: ${SIGINEX_API_KEYS:-demo-key}
    ports:
      - "3000:3000"

volumes:
  siginex_pgdata:
